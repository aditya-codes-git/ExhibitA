services:
  - type: web
    name: exhibita-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm run start -w @exhibita/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: exhibita-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: exhibita-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          name: exhibita-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
